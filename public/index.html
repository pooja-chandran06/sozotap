<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOZOTAP — Emergency Medical Security System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #D32F2F;
      --primary-dark: #9A0007;
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent: #FF5252;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      background: rgba(211, 47, 47, 0.2);
      color: var(--accent);
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(211, 47, 47, 0.4);
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: 1px;
      color: #FFFFFF;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
      display: block;
    }
    .footer-note {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">SECURE EMERGENCY IDENTITY</span>
    <span class="icon">🆘</span>
    <h1>SOZOTAP</h1>
    <p>Emergency Medical & Vital Protection System. If you scanned an Emergency QR tag, please use the direct link on the tag or scan again using a camera app.</p>
    <div class="footer-note">&copy; 2026 SOZOTAP. All Rights Reserved. Cryptographically Encrypted Response Platform.</div>
  </div>
</body>
</html>
